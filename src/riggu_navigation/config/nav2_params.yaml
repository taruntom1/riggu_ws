# Nav2 params for riggu, shared by sim and real (use_sim_time comes from the launch).
# Phase 7: localisation (map_server + AMCL). Phase 8 adds the planner, controller,
# smoother and costmaps.
#
# Set by the launch, not here:
#   map_server.yaml_filename         launch arg `map`
#   amcl.laser_min_range/max_range   riggu_description robot.yaml lidar.range_min/max

map_server:
  ros__parameters:
    yaml_filename: ""
    topic_name: map
    frame_id: map

amcl:
  ros__parameters:
    robot_model_type: nav2_amcl::DifferentialMotionModel
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan
    tf_broadcast: true
    transform_tolerance: 1.0
    # Odometry noise (EKF odom: calibrated wheels + gyro)
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    # Filter
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    update_min_d: 0.25
    update_min_a: 0.2
    save_pose_rate: 0.5
    set_initial_pose: false
    # Laser model (C1: 500 beams per scan, 60 used)
    laser_model_type: likelihood_field
    max_beams: 60
    laser_likelihood_max_dist: 2.0
    sigma_hit: 0.2
    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    lambda_short: 0.1
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
