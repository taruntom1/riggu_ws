# robot_localization ekf_node: odom -> base_footprint, shared by mode:=real|sim|mock.
# bringup.launch.py loads this file, then:
#   use_imu_orientation:=false  -> overrides from ekf_gyro_only.yaml (no absolute yaw)
#   imu:=false                  -> drops every imu0* key (wheel odometry only)
# Input covariances come from the sources: wheel_twist.yaml covariance_diagonal and
# imu_sensor_broadcaster static_covariance_* (controllers.yaml).
#
# Config vector order (15): x y z, roll pitch yaw, vx vy vz, vroll vpitch vyaw, ax ay az.

ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true
    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Wheel velocity: vx, plus vy = 0 (non-holonomic), and vyaw. From riggu_bringup/wheel_twist
    # (/joint_states), not diff_drive_controller's /odom: that stops while disarmed, and an EKF
    # without a velocity measurement lets its velocity covariance grow without bound.
    twist0: /wheel/twist
    twist0_config: [false, false, false,
                    false, false, false,
                    true,  true,  false,
                    false, false, true,
                    false, false, false]
    twist0_queue_size: 10

    # BNO055 (NDOF fusion): absolute yaw and vyaw. Yaw is fused relative to the first
    # sample, so odom starts at yaw 0 instead of magnetic north.
    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 10
    imu0_differential: false
    imu0_relative: true
    imu0_remove_gravitational_acceleration: true
