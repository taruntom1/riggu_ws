# riggu_bringup/wheel_twist: /joint_states -> /wheel/twist for the EKF (twist0), armed or not.
# wheel_radius / wheel_separation are NOT here: bringup.launch.py passes them from
# riggu_description/config/robot.yaml, as for diff_drive_controller.

wheel_twist:
  ros__parameters:
    left_wheel: left_wheel_joint
    right_wheel: right_wheel_joint
    frame_id: base_footprint
    # vx, vy, vz, vroll, vpitch, vyaw; same as diff_drive_controller twist_covariance_diagonal
    covariance_diagonal: [0.001, 0.001, 1.0e6, 1.0e6, 1.0e6, 0.01]
