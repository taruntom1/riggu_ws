# Gamepad mapping: every button and axis index lives here (none in code).
# Find indices with `ros2 topic echo /joy` (see README "Mapping a new pad").
# Defaults: riggu's USB pad (PlayStation shape, enumerates as "Microsoft X-Box 360 pad",
# 045e:028e, xpad driver), measured 2026-11-28:
#   buttons  0 A  1 B  2 X  3 Y  4 LB/L1  5 RB/R1  6 Back/Select  7 Start  8 Home  9 L3  10 R3
#   axes     0 left X (+left)  1 left Y (+up)  2 LT (rest +1)  3 right X  4 right Y
#            5 RT (rest +1)  6 d-pad X  7 d-pad Y

joy_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.05
    autorepeat_rate: 20.0  # Hz; /joy keeps flowing while a button is held
    coalesce_interval_ms: 1

teleop_twist_joy_node:
  ros__parameters:
    publish_stamped_twist: true
    frame: base_footprint
    require_enable_button: true
    enable_button: 4           # deadman: LB (L1)
    enable_turbo_button: 5     # turbo deadman: RB (R1)
    axis_linear:
      x: 1                     # left stick up/down
    axis_angular:
      yaw: 0                   # left stick left/right
    scale_linear:
      x: 0.2                   # m/s
    scale_linear_turbo:
      x: 0.5                   # = robot.yaml limits.max_linear_velocity
    scale_angular:
      yaw: 1.0                 # rad/s
    scale_angular_turbo:
      yaw: 2.0                 # = robot.yaml limits.max_angular_velocity
    inverted_reverse: false

stop_latch:
  ros__parameters:
    button: 1                  # B: toggles /estop
    rate: 10.0                 # Hz heartbeat; twist_mux locks if it stops

arm_switch:
  ros__parameters:
    arm_buttons: [4, 7]        # hold LB + Start ...
    arm_hold: 1.0              # ... for this long (s) to arm
    disarm_button: 6           # Back/Select: disarm at once
    controller: diff_drive_controller
